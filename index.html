<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARAM KACHING</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  display:grid;place-items:center;color:#fff;
  font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;
  background:
    radial-gradient(circle at 50% 38%,rgba(255,214,68,.18),transparent 25%),
    radial-gradient(circle at 15% 15%,rgba(112,55,255,.20),transparent 30%),
    linear-gradient(145deg,#08090d,#17121e 58%,#07080b);
}
.stage{
  position:relative;width:100vw;height:100vh;display:flex;
  flex-direction:column;align-items:center;justify-content:center;isolation:isolate
}
.glow{
  position:absolute;width:min(620px,90vw);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,205,48,.22),rgba(255,205,48,.05) 45%,transparent 70%);
  filter:blur(10px);z-index:-1
}
.face-wrap{
  position:relative;width:min(530px,72vw,62vh);aspect-ratio:1;
  display:grid;place-items:center;z-index:4;transform-origin:50% 55%
}
#aram{
  width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 28px 30px rgba(0,0,0,.6))
}
#buy{
  z-index:20;margin-top:10px;min-width:220px;padding:18px 48px 14px;
  border:4px solid #111;border-radius:18px;
  background:linear-gradient(#ffe95c,#ffb914);color:#111;
  font:inherit;font-size:clamp(36px,6vw,58px);line-height:.9;letter-spacing:2px;
  cursor:pointer;box-shadow:0 9px 0 #9c6200,0 16px 30px rgba(0,0,0,.5),
  inset 0 3px 0 rgba(255,255,255,.7);
  transform:rotate(-1deg);transition:.08s
}
#buy:hover{transform:rotate(1deg) scale(1.05)}
#buy:active{transform:translateY(7px);box-shadow:0 2px 0 #9c6200,0 8px 15px #0008}

.money{
  position:fixed;left:var(--sx);top:var(--sy);z-index:10;
  font-family:Arial,sans-serif;font-size:var(--size);pointer-events:none;
  filter:drop-shadow(3px 5px 3px #0008);
  animation:moneyIn var(--dur) cubic-bezier(.2,.75,.25,1) forwards
}
@keyframes moneyIn{
  0%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(.25);opacity:0}
  10%{opacity:1}
  82%{opacity:1}
  100%{left:50%;top:43%;transform:translate(-50%,-50%) rotate(0) scale(.55);opacity:0}
}

.kach{
  position:fixed;left:50%;top:40%;z-index:40;width:96vw;text-align:center;
  pointer-events:none;color:#ffe347;
  -webkit-text-stroke:clamp(2px,.5vw,6px) #15100a;
  text-shadow:
    3px 3px 0 #fff,
    7px 7px 0 #ff6b00,
    12px 12px 0 #d52b00,
    17px 17px 0 #000b;
  font-size:clamp(58px,12vw,132px);line-height:.78;
  letter-spacing:-2px;
  font-style:italic;
  transform:translate(-50%,-50%) scale(.08) rotate(-10deg);opacity:0;
  animation:pop 1.25s cubic-bezier(.18,.89,.32,1.35) forwards
}
.kach small{display:block;font-size:.42em;margin-top:.25em}
.kach.low{font-size:clamp(38px,8vw,76px);color:#eee;text-shadow:3px 4px 0 #777,6px 7px 0 #0009}
.kach.shipping{
  font-size:clamp(64px,12vw,125px);
  color:#fff36b;
  line-height:.82;
  -webkit-text-stroke:4px #111;
  text-shadow:4px 5px 0 #ff6b00,8px 9px 0 #111;
}
.kach.shipping small{
  display:block;
  font-size:.58em;
  margin-top:.30em;
  color:#fff;
  -webkit-text-stroke:3px #111;
  text-shadow:3px 4px 0 #ff6b00,6px 7px 0 #111;
}
.kach.jackpot{font-size:clamp(82px,15vw,165px);text-shadow:5px 6px 0 #ff7900,10px 12px 0 #d41d00,15px 17px 0 #0009}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.08) rotate(-12deg)}
  55%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(4deg)}
  75%{transform:translate(-50%,-50%) scale(.94) rotate(-2deg)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg)}
}

.jersey{
  position:fixed;left:50%;top:43%;z-index:35;width:105px;height:120px;
  pointer-events:none;transform:translate(-50%,-50%) scale(.12) rotate(var(--jr));
  filter:drop-shadow(8px 12px 8px #0008);
  animation:jerseyOut 1.55s cubic-bezier(.12,.7,.25,1) forwards
}
.jersey svg{width:100%;height:100%;overflow:visible}
@keyframes jerseyOut{
  0%{transform:translate(-50%,-50%) scale(.08) rotate(var(--jr));opacity:0}
  15%{opacity:1}
  60%{transform:translate(-50%,-50%) scale(2.2) rotate(calc(var(--jr) * -.5));opacity:1}
  100%{left:var(--ex);top:var(--ey);transform:translate(-50%,-50%) scale(5.8) rotate(var(--endrot));opacity:0}
}

.parcel{
  position:fixed;left:50%;top:43%;z-index:36;font-size:58px;pointer-events:none;
  animation:parcelOut 1.05s ease-out forwards
}
@keyframes parcelOut{
  0%{transform:translate(-50%,-50%) scale(.15);opacity:0}
  15%{opacity:1}
  100%{left:78%;top:78%;transform:translate(-50%,-50%) scale(3.2) rotate(25deg);opacity:0}
}

.face-hit{animation:faceHit .55s ease}
.face-jackpot{animation:faceJackpot .85s ease}
.shake{animation:screenShake .5s linear}
@keyframes faceHit{0%,100%{transform:scale(1)}35%{transform:scale(1.06) rotate(-2deg)}60%{transform:scale(.98) rotate(2deg)}}
@keyframes faceJackpot{0%,100%{transform:scale(1)}20%{transform:scale(1.12) rotate(-3deg)}40%{transform:scale(.96) rotate(3deg)}60%{transform:scale(1.08) rotate(-2deg)}}
@keyframes screenShake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,5px)}}

@media(max-height:650px){
 .face-wrap{width:min(390px,55vh)}
 #buy{padding:12px 40px 10px;font-size:38px;margin-top:0}
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="glow"></div>
  <div class="face-wrap" id="faceWrap"><img id="aram" src="aram.png" alt="Aram"></div>
  <button id="buy">BUY</button>
</main>

<script>
const prizes=[
 {text:"50 KACHING!!!",level:"low",weight:8},
 {text:"75 KR",sub:"INKL. FRAKT 📦",level:"shipping",weight:3},
 {text:"150 KACHING!!!",level:"low",weight:7},
 {text:"300 KACHING!!!",level:"normal",weight:9},
 {text:"500 KACHING!!!",level:"normal",weight:11},
 {text:"750 KACHING!!!",level:"normal",weight:10},
 {text:"900 KACHING!!!",level:"normal",weight:10},
 {text:"1200 KACHING!!!",level:"normal",weight:10},
 {text:"1500 KACHING!!!",level:"normal",weight:9},
 {text:"1700 KACHING!!!",level:"normal",weight:8},
 {text:"2000 KACHING!!!",level:"normal",weight:6},
 {text:"2500 KACHING!!!",level:"jackpot",weight:4},
 {text:"3000 KACHING!!!",level:"jackpot",weight:3}
];

const shirtStyles=[
 ["#d91e36","#ffffff","solid"],["#1769d2","#ffffff","solid"],
 ["#f1cf24","#111111","solid"],["#159447","#ffffff","solid"],
 ["#111111","#ffffff","solid"],["#f4f4f4","#111111","solid"],
 ["#7b2cbf","#ffffff","solid"],["#f26b21","#111111","solid"],
 ["#d91e36","#ffffff","stripe"],["#1769d2","#ffffff","stripe"],
 ["#111111","#f4f4f4","stripe"]
];

const stage=document.getElementById("stage");
const face=document.getElementById("faceWrap");

function pickPrize(){
 let total=prizes.reduce((a,p)=>a+p.weight,0),r=Math.random()*total;
 for(const p of prizes){r-=p.weight;if(r<=0)return p}
 return prizes.at(-1);
}
function money(count,slow=false){
 for(let i=0;i<count;i++){
  const el=document.createElement("div"); el.className="money";
  el.textContent=Math.random()>.25?"💸":"💵";
  const edge=Math.floor(Math.random()*4); let x,y;
  if(edge===0){x=-8;y=Math.random()*100}
  if(edge===1){x=108;y=Math.random()*100}
  if(edge===2){x=Math.random()*100;y=-8}
  if(edge===3){x=Math.random()*100;y=108}
  el.style.setProperty("--sx",x+"vw");el.style.setProperty("--sy",y+"vh");
  el.style.setProperty("--rot",(Math.random()*180-90)+"deg");
  el.style.setProperty("--size",(slow?72:88+Math.random()*80)+"px");
  el.style.setProperty("--dur",(slow?1.75:1.25+Math.random()*.55)+"s");
  el.style.animationDelay=(Math.random()*.28)+"s";
  document.body.appendChild(el);setTimeout(()=>el.remove(),2600);
 }
}
function text(p){
 const el=document.createElement("div");el.className="kach";
 if(p.level==="low")el.classList.add("low");
 if(p.level==="shipping")el.classList.add("shipping");
 if(p.level==="jackpot")el.classList.add("jackpot");
 el.innerHTML=p.text+(p.sub?`<small>${p.sub}</small>`:"");
 document.body.appendChild(el);
 setTimeout(()=>{el.style.transition="opacity .3s";el.style.opacity=0},1650);
 setTimeout(()=>el.remove(),2050);
}
function jersey(){
 const [base,accent,type]=shirtStyles[Math.floor(Math.random()*shirtStyles.length)];
 const el=document.createElement("div");el.className="jersey";
 el.style.setProperty("--jr",(Math.random()*30-15)+"deg");
 el.style.setProperty("--endrot",(Math.random()*100-50)+"deg");
 el.style.setProperty("--ex",(20+Math.random()*60)+"vw");
 el.style.setProperty("--ey",(15+Math.random()*70)+"vh");
 const pattern=type==="stripe"
 ? `<path d="M35 24h12v75H35zM59 24h12v75H59z" fill="${accent}" opacity=".92"/>`
 : `<path d="M43 20q10 10 20 0" fill="none" stroke="${accent}" stroke-width="5"/>`;
 el.innerHTML=`<svg viewBox="0 0 106 120">
 <path d="M35 18L15 27 2 51l18 10 10-15v58h46V46l10 15 18-10-13-24-20-9c-5 8-11 11-18 11s-13-3-18-11z"
 fill="${base}" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
 ${pattern}
 <circle cx="76" cy="35" r="5" fill="${accent}" stroke="#111" stroke-width="2"/>
 </svg>`;
 document.body.appendChild(el);setTimeout(()=>el.remove(),1850);
}
function hit(jackpot){
 face.classList.remove("face-hit","face-jackpot");void face.offsetWidth;
 face.classList.add(jackpot?"face-jackpot":"face-hit");
 setTimeout(()=>face.classList.remove("face-hit","face-jackpot"),900);
}
document.getElementById("buy").addEventListener("click",()=>{
 // Count every BUY click in GoatCounter as its own event.
 if (window.goatcounter && typeof window.goatcounter.count === "function") {
   window.goatcounter.count({
     path: "BUY",
     title: "BUY click",
     event: true
   });
 }
 const p=pickPrize();
 const low=p.level==="low"||p.level==="shipping";
 money(p.level==="jackpot"?27:low?2:12,low);
 if(p.level==="jackpot"){stage.classList.remove("shake");void stage.offsetWidth;stage.classList.add("shake");setTimeout(()=>stage.classList.remove("shake"),600)}
 setTimeout(()=>hit(p.level==="jackpot"),low?1250:1050);
 setTimeout(()=>text(p),low?1280:1080);
 // Product comes BACK from Aram after the money reaches him.
 setTimeout(()=>{
   jersey();
   if(p.level==="shipping"){
     const box=document.createElement("div");box.className="parcel";box.textContent="📦";
     document.body.appendChild(box);setTimeout(()=>box.remove(),1200);
   }
 },low?2050:1850);
});
</script>

<script data-goatcounter="https://vaarmann.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
